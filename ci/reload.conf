# The part of the reload test that differs per module.  ci/reload.sh sources
# this with $WORK and $PORT already set and then drives the reloads.
#
#     RELOAD_HTTP    directives for the http block, may be empty
#     RELOAD_SERVER  directives for the server block
#     RELOAD_EXPECT  what reload_probe has to print
#     reload_probe   prints what the server answered
#
# Needs the database ci/postgres.sh sets up.

RELOAD_PGPORT=${PGPORT:-15432}
RELOAD_DB=${PGDATABASE:-ngxtest}

RELOAD_HTTP="
    upstream reload_pg {
        postgres_server 127.0.0.1:$RELOAD_PGPORT dbname=$RELOAD_DB user=postgres;
        postgres_keepalive max=2;
    }"

RELOAD_SERVER="
        location /probe {
            postgres_pass reload_pg;
            postgres_query 'select answer from single';
            postgres_output value;
        }"

# The answer comes out of the database, so this asks the module and not the
# server: a reload that dropped the module answers 404 here, and one that
# lost the connection pool answers 502.  Either way the probe prints
# something else and the round fails.
#
# The keepalive pool is the reason this gate matters for this module more
# than for most: it holds open connections across a reload, and a cycle that
# leaked one would show up in the master's descriptor count, which
# ci/reload.sh counts after every round.
RELOAD_EXPECT='42'

reload_probe() {
	curl -s --max-time 10 "http://127.0.0.1:$PORT/probe" | tr -d '\r\n'
}
